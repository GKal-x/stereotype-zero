<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#273849">
<title>Stereotype Zero · Kato Patisia</title>
<link rel="stylesheet" href="style.css">
<script src="world.js" defer></script>
<script src="opening.js" defer></script><script src="combat.js" defer></script>
<script src="life-world.js" defer></script><script src="memories.js" defer></script>
<script src="rooms.js" defer></script>
<script src="engine.js" defer></script>
<script src="motion.js" defer></script>
<script src="assets/pixel-art.js" defer></script>
<script src="assets/cast-refined.js" defer></script>
<script src="assets/supervisor.js" defer></script>
<script src="assets/memories-atlas.js" defer></script>
<script src="assets/family-atlas.js" defer></script>
<script src="props.js" defer></script>
<script src="assets/adults-atlas.js" defer></script><script src="assets/scouts-atlas.js" defer></script><script src="assets/youth-atlas.js" defer></script><script src="cinematics.js" defer></script><script src="assets/ensemble-atlas.js" defer></script>
<script src="art.js" defer></script>
<script src="map-ui.js" defer></script>
<script src="audio.js" defer></script>
<script src="game.js" defer></script>
</head>
<body data-mode="intro">
<div class="game-shell">
<header class="hud" aria-label="Game status">
<button id="journal" class="hud-button" aria-label="Open journal and save menu">☰</button>
<div class="district"><small>KATO PATISIA</small><b id="clock">17:20</b></div>
<div class="pocket"><small>POCKET</small><b id="money">€8.40</b></div>
<div class="vitals"><div><span>ENERGY</span><div class="meter"><i id="energy-meter"></i></div></div><div><span>STRESS</span><div class="stress-meter"><i id="stress-meter"></i></div></div></div>
<button id="sound" class="hud-button" aria-label="Enable music" aria-pressed="false">♪</button>
<button id="phone" class="hud-button phone-button" aria-label="Open phone">▣<i></i></button>
</header>
<main class="world" id="world" aria-label="Kato Patisia game">
<canvas id="game" width="320" height="320" tabindex="0" aria-label="Neighborhood map. Use the direction arrows or arrow keys. Tap a person or doorway to walk there. Press A to talk."></canvas>
<div id="location-tag" class="location-tag">ΠΑΤΗΣΙΑ · BACKSTREETS</div>
<button id="map" class="minimap-button" aria-label="Open neighborhood and Athens map"><canvas id="mini-map" width="128" height="96" aria-hidden="true"></canvas><span>MAP · N ↑</span></button>
<div id="walk-target" class="walk-target" hidden></div>
<div id="nearby-prompt" class="nearby-prompt" hidden><span>A</span><b></b></div>
<div id="overlay" class="overlay"></div>
<div id="boot" class="boot"><b>STEREOTYPE ZERO</b><span>Opening the neighborhood…</span></div>
</main>
<footer class="control-deck">
<div id="direction-pad" class="direction-pad" role="group" aria-label="Direction arrows">
<span class="pad-centre" aria-hidden="true"></span>
<button class="pad-hit up" data-move="up" aria-label="Move up">▲</button>
<button class="pad-hit left" data-move="left" aria-label="Move left">◀</button>
<button class="pad-hit right" data-move="right" aria-label="Move right">▶</button>
<button class="pad-hit down" data-move="down" aria-label="Move down">▼</button>
</div>
<div class="control-message"><span id="speaker">ARIS</span><p id="line" aria-live="polite">An evening in Kato Patisia.</p></div>
<div class="action-buttons"><button id="back" class="b-button" aria-label="Back or close">B<small>BACK</small></button><button id="action" class="a-button" aria-label="Talk or confirm">A<small id="action-label">TALK</small></button></div>
</footer>
<div id="save-toast" class="save-toast" role="status"></div>
<aside hidden aria-hidden="true"><span id="energy"></span><span id="stress"></span><span id="quest-count"></span><ol id="quests"></ol><div id="speaker-icon"></div><canvas id="portrait" width="64" height="64"></canvas><button id="interact"></button><button id="save"></button><button id="load"></button><p id="save-status"></p></aside>
</div>
</body>
</html>

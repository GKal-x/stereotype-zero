name: Stereotype Zero Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stereotype-zero-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check game rules and scripts
        shell: pwsh
        run: |
          node --test engine.test.js motion.test.js world.test.js level.test.js memories.test.js audio.test.js physics.test.js childhood.test.js life.test.js combat.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check game.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check life-world.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check opening.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check cinematics.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check map-ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check memories.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check rooms.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check world.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check assets/pixel-art.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check props.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check art.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check audio.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Android SDK
        shell: pwsh
        run: |
          if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME = $env:JAVA_HOME_21_X64 }
          $manager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Filter sdkmanager.bat -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $manager) { throw 'Android SDK manager not found on runner.' }
          & $manager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with the persistent prototype signing key
        env:
          STEREOTYPE_ZERO_KEYSTORE_B64: ${{ secrets.STEREOTYPE_ZERO_KEYSTORE_B64 }}
        shell: pwsh
        run: |
          if (-not $env:STEREOTYPE_ZERO_KEYSTORE_B64) { throw 'Set STEREOTYPE_ZERO_KEYSTORE_B64 before building. A stable key is needed for updates.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'stereotype-zero.keystore'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:STEREOTYPE_ZERO_KEYSTORE_B64))
          ./build-android.ps1 -JdkHome $env:JAVA_HOME -SdkRoot $env:ANDROID_HOME -SigningKeystore $keyPath
      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stereotype-zero-android-${{ github.run_number }}
          path: |
            dist/stereotype-zero-0.15.3.apk
            dist/stereotype-zero-0.15.3.apk.sha256
            dist/startup-tests.apk
            dist/stereotype-zero-chip-score-0.15.3.zip
          if-no-files-found: error
          retention-days: 30

  android-startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stereotype-zero-android-${{ github.run_number }}
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify startup and save recovery in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r dist/stereotype-zero-0.15.3.apk
            adb install -r dist/startup-tests.apk
            adb shell am instrument -w gr.stereotypezero.smoke/gr.stereotypezero.smoke.StartupSmoke | tee dist/android-startup.txt
            adb logcat -d > dist/android-logcat.txt
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-startup.png dist/android-startup.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-walk.png dist/android-walk.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-pad.png dist/android-pad.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-cast.png dist/android-cast.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-guard.png dist/android-guard.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-battle.png dist/android-battle.png
            adb pull /sdcard/Android/data/gr.stereotypezero.game/files/android-cordon.png dist/android-cordon.png
            grep -q 'INSTRUMENTATION_RESULT: result=PASS' dist/android-startup.txt
      - name: Keep Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-${{ github.run_number }}
          path: |
            dist/android-startup.txt
            dist/android-logcat.txt
            dist/android-startup.png
            dist/android-walk.png
            dist/android-pad.png
            dist/android-cast.png
            dist/android-guard.png
            dist/android-battle.png
            dist/android-cordon.png
          if-no-files-found: warn

  release:
    needs: [build, android-startup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stereotype-zero-android-${{ github.run_number }}
          path: dist
      - name: Publish the verified Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-$GITHUB_RUN_NUMBER" dist/stereotype-zero-0.15.3.apk dist/stereotype-zero-0.15.3.apk.sha256 dist/stereotype-zero-chip-score-0.15.3.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Stereotype Zero Android preview $GITHUB_RUN_NUMBER" --prerelease --notes "Restored circular thumb pad with captured drag steering, centre dead zone, direction hysteresis and fixed speed. Keeps continuous slow walking, bounded deliberate taps and automatic doors. Latest steering intent replaces stale input. Pixel camera follows without trailing; stride phase continues across turns. Existing saves and character art retained. Native touch, held-walking, combat and save checks gate release. Android 8.0+. Built from $GITHUB_SHA."
